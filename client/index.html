    <title>Code Space</title>
    <style>
      :root {
        --boot-bg: #f4f4f4;
        --boot-text: #141718;
        --boot-dim: #626965;
        --boot-track: rgba(20, 23, 24, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-color-mode="light"]) {
          --boot-bg: #090b0c;
          --boot-text: #e8eade;
          --boot-dim: #929b94;
          --boot-track: rgba(232, 234, 222, 0.14);
        }
      }
      :root[data-color-mode="dark"] {
        --boot-bg: #090b0c;
        --boot-text: #e8eade;
        --boot-dim: #929b94;
        --boot-track: rgba(232, 234, 222, 0.14);
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
        color: var(--boot-text);
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--boot-bg);
        font: 12px/1.4 "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        color: var(--boot-dim);
      }
      .boot-loader-box {
        width: min(220px, 70vw);
        display: grid;
        gap: 10px;
        text-align: center;
      }
      .boot-progress-track {
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
      }
      @keyframes boot-progress-crawl {
        0% { width: 6%; }
        35% { width: 42%; }
        70% { width: 72%; }
        100% { width: 88%; }
      }
      .boot-progress-fill {
        width: 6%;
        height: 100%;
        border-radius: 999px;
        background: var(--boot-text);
        animation: boot-progress-crawl 3.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
    <script src="./src/main.tsx" type="module"></script>
  </head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="muse-code-space"
    >
      <div class="boot-loader" role="status" aria-live="polite" aria-label="Loading code space">
        <div class="boot-loader-box">
          <span>Loading code space…</span>
          <div class="boot-progress-track" aria-hidden="true">
            <div id="boot-progress-fill" class="boot-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
